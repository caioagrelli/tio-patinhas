services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: patinhas_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d patinhas_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://test:test@db-test:5432/patinhas_test
    depends_on:
      db-test:
        condition: service_healthy
  app-test:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://test:test@db-test:5432/patinhas_test?schema=e2e
      COOKIE_SECURE: "false"
    depends_on:
      db-test:
        condition: service_healthy
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://app-test:3000
      CI: "true"
    depends_on:
      app-test:
        condition: service_healthy
    ipc: host
