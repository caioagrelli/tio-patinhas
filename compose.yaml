services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patinhas}
      POSTGRES_USER: ${POSTGRES_USER:-patinhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  # Applies the versioned migrations once and exits; the app only starts after it succeeds.
  migrate:
    build:
      context: .
      target: runtime
    image: ${APP_IMAGE:-crab-finance:local}
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-patinhas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-patinhas}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  app:
    build:
      context: .
      target: runtime
    image: ${APP_IMAGE:-crab-finance:local}
    environment:
      # Each app server keeps at most DATABASE_CONNECTION_LIMIT connections (servers x limit must fit the database).
      DATABASE_URL: postgresql://${POSTGRES_USER:-patinhas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-patinhas}?schema=public&connection_limit=${DATABASE_CONNECTION_LIMIT:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CRAB_AI_MODEL: ${CRAB_AI_MODEL:-}
      CRAB_AI_MONTHLY_TOKENS: ${CRAB_AI_MONTHLY_TOKENS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
volumes:
  postgres-data:
