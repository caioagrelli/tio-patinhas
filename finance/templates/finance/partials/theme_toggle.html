{% comment %} Botão de alternar tema claro/escuro (a preferência fica salva no navegador) {% endcomment %}
<button type="button" onclick="alternarTema()" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro"
        class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-borderdark text-muted hover:text-fg hover:border-fg transition">
    <!-- Sol: aparece no tema escuro (clique para ir ao claro) -->
    <svg class="h-4 w-4 hidden [.dark_&]:block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <!-- Lua: aparece no tema claro -->
    <svg class="h-4 w-4 hidden [.light_&]:block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
</button>
